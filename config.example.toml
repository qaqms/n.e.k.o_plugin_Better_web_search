[plugin_runtime]
enabled = true
auto_start = true

[search]
# 后端链路（全部免 API Key）：前一个失败自动换下一个。
# 顺序按国内直连实测排：exa 1.6–3.5s、anysearch 1.2–5.0s、bing 0.6s；
# baidu 直连常撞“百度安全验证”（靠预热救），放最后；sogou 实测无结果，不启用。
backend = "auto"
backend_chain = ["exa", "anysearch", "bing", "baidu"]
max_results = 6
timeout_seconds = 12
total_timeout_seconds = 25

# 代理：auto=跟随系统/环境变量，off=不用，on=全走，或直接填 http://127.0.0.1:7890
proxy = "auto"
proxy_url = ""
# 单个后端可覆盖（direct / proxy / auto）
duckduckgo_proxy = "proxy"
bing_proxy = "direct"
baidu_proxy = "direct"
duckduckgo_method = "POST"

# 可选增强，留空也能用
anysearch_api_key = ""
anysearch_zone = ""
searxng_base_url = ""
exa_live_crawl = false

# Exa 密钥（可选升级，不是必需）：注册地址 https://dashboard.exa.ai/api-keys
# （国内直连可达，建议邮箱注册）；免费档每月刷新约 $10 ≈ 1400 次。
# 更推荐在插件面板里填写并一键测试；这里只显示 exa****尾4位。
exa_api_key = ""
# auto=永远用快路径（advanced 实测 3.7–11.7s 会顶穿 12s 预算，只在明确需要时选）
exa_tool = "auto"
# 密钥无效/额度用尽时，本次搜索自动降级为匿名档（不填密钥也能搜）
exa_key_fallback_anonymous = true
# baidu 先领 BAIDUID cookie 再搜（不领基本必撞“百度安全验证”）
baidu_warmup = true
# 没检测到任何代理时，duckduckgo 不进实际链路（直连只会超时报错）
duckduckgo_needs_proxy = true

# 正文抓取
max_content_chars = 4000
fetch_total_timeout_seconds = 24

# 缓存与限流
cache_ttl_seconds = 300
stale_ttl_seconds = 1800
cache_entries = 128
queue_wait_seconds = 2
cooldown_seconds = 60
baidu_cooldown_seconds = 120
duckduckgo_cooldown_seconds = 300

[net]
# fetch 的 SSRF 白名单：只对“域名解析出来的结果”放行，手填 IP/localhost/
# 云元数据地址一律照旧拒绝。这里放行 198.18.0.0/15 是为了兼容 TUN+fake-ip
# 代理（它们把外网域名解析成假 IP）。不懂就保持默认；填 [] 表示全不放行。
ssrf_allow_ranges = ["198.18.0.0/15"]

[ui]
# 面板引导进度，由面板维护：""|welcome|trial|done
onboarding_stage = ""
# 首启引导提示只发一次（猫娘会在第一次启动时开口引导）
first_run_notice_sent = false

[host]
# true=每次启动重申“停用宿主内置网络搜索”，由本插件独占搜索入口。
# 请在面板里切换，不要手改；失败只记日志，绝不影响插件启动。
takeover_search = false
