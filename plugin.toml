[plugin]
name = "免费联网搜索"
id = "free_web_search"
version = "0.2.0"
type = "plugin"
description = "不需要任何 API Key 的联网搜索与网页正文阅读。开箱即用，失败自动换后端；自带面板新手引导（可一键填入 Exa 免费密钥）、内置搜索双向开关、代理软件兼容开关与网络自检；支持代理与自建 SearXNG。"
short_description = "免 Key 联网搜索 + 网页正文，多后端自动回退；面板一键引导与自检。"
keywords = ["搜索", "联网", "搜一", "查一查", "网页", "search", "web", "fetch", "免费",
            "duckduckgo", "google", "検索", "調べ", "검색", "поиск", "busca"]
entry = "plugin.plugins.free_web_search:FreeWebSearchPlugin"

[plugin.author]
name = "N.E.K.O Plugin Community"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

# 面板与引导：宿主卡片会自动多出“打开面板”按钮（声明 panel 即生效）。
# .tsx 面板、.md 教程的模式由宿主按文件后缀自动推断，不要写 mode。
[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "联网搜索"
entry = "ui/panel.tsx"
context = "main"
permissions = ["state:read", "action:call"]

[[plugin.ui.guide]]
id = "quickstart"
title = "接入教程"
entry = "docs/quickstart.md"
permissions = ["state:read"]

[search]
# ---------------------------------------------------------------------------
# 后端链路：全部免 API Key，按顺序尝试，前一个失败就自动换下一个。
# 下表是 mainland 直连实测结果（代理关闭），决定了默认顺序：
# exa=公共 MCP 网关（免 Key，直接返回网页正文，直连 1.6–3.5 秒）
# anysearch=匿名可用的搜索 API（直连 1.2–5.0 秒）
# bing=直连约 0.6 秒，中英文效果好，已进默认链路
# baidu=直连经常撞“百度安全验证”，靠 BAIDUID 预热才勉强能用，放最后
# duckduckgo=直连 DNS 污染直接超时，只有检测到代理才会进链路（见下）
# sogou=实测无可解析结果，实现了但不进默认链路
# searxng=你自己的实例，需在下面填 searxng_base_url
# ---------------------------------------------------------------------------
backend = "auto"
backend_chain = ["exa", "anysearch", "bing", "baidu"]
# 对话里没指定条数时用这个值（上限 15）
max_results = 6
timeout_seconds = 12
# 所有回退都要在宿主 30 秒看门狗内跑完。
total_timeout_seconds = 25

# ---------------------------------------------------------------------------
# 代理：这是"搜索突然不能用"最常见的原因。
# auto   = 跟随系统/环境变量代理；各后端再用 *_proxy 微调
# off    = 一律不走代理
# on     = 一律走系统代理
# 也可以直接填 http://127.0.0.1:7890
# ---------------------------------------------------------------------------
proxy = "auto"
proxy_url = ""
# 单个后端可覆盖：direct=强制直连，proxy=强制走代理，auto=跟随上面的设置
duckduckgo_proxy = "proxy"
exa_proxy = "auto"
anysearch_proxy = "auto"
bing_proxy = "direct"
sogou_proxy = "direct"
baidu_proxy = "direct"
# DuckDuckGo 用 POST 表单更稳（GET 常被返回空页）。
duckduckgo_method = "POST"

# ---------------------------------------------------------------------------
# 可选增强（留空也能用）
# ---------------------------------------------------------------------------
anysearch_api_key = ""
# cn / intl / 留空
anysearch_zone = ""
# 自建实例示例：http://127.0.0.1:8888 （远程实例必须 https）
searxng_base_url = ""
# 开启后 Exa 会实时抓取网页，更新但更慢
exa_live_crawl = false

# ---------------------------------------------------------------------------
# Exa 密钥（可选升级，不是必需）：在面板里填写更方便，也更安全
# 注册地址 https://dashboard.exa.ai/api-keys（国内直连可达，用邮箱注册）；
# 免费档每月刷新约 $10 额度 ≈ 1400 次搜索；不填也能用，只是匿名档慢且限额低。
# 密钥只存在本插件配置里，面板/日志一律只显示 exa****尾4位。
# ---------------------------------------------------------------------------
exa_api_key = ""
# 用哪个 Exa 工具：auto=永远用快路径（实测 advanced 3.7–11.7 秒会顶穿 12 秒预算），
# 只有明确想要更全结果时才选 advanced；simple=强制快路径
exa_tool = "auto"
# 密钥无效/额度用尽时，本次搜索自动降级成匿名档（而不是直接报错）
exa_key_fallback_anonymous = true
# baidu 先领 BAIDUID cookie 再搜（实测不领必撞“百度安全验证”）
baidu_warmup = true
# 没检测到任何代理时，duckduckgo 不进实际链路（直连只会白白耗掉几秒）
duckduckgo_needs_proxy = true

# ---------------------------------------------------------------------------
# 正文抓取
# ---------------------------------------------------------------------------
max_content_chars = 4000
fetch_total_timeout_seconds = 24

# ---------------------------------------------------------------------------
# 缓存与限流：免 Key 通道是公共资源，打太猛会被限流甚至封 IP
# ---------------------------------------------------------------------------
cache_ttl_seconds = 300
stale_ttl_seconds = 1800
cache_entries = 128
queue_wait_seconds = 2
cooldown_seconds = 60
exa_min_interval_seconds = 0.5
anysearch_min_interval_seconds = 0.75
bing_min_interval_seconds = 2
sogou_min_interval_seconds = 3
baidu_min_interval_seconds = 10
duckduckgo_min_interval_seconds = 3
searxng_min_interval_seconds = 0.5
baidu_cooldown_seconds = 120
duckduckgo_cooldown_seconds = 300
# 网络自检用的固定查询词（只影响自检，不影响正常搜索）
diagnose_query = "N.E.K.O 猫娘 插件"

[net]
# ---------------------------------------------------------------------------
# 安全：fetch 链接的 SSRF 防护默认拒绝一切内网地址。
# 只有一种例外：开了 TUN + fake-ip 模式的代理会把域名解析成 198.18.x.x 假 IP，
# 这里放行的段仅对“域名解析结果”生效；手填 IP、localhost、云元数据地址照旧拒绝。
# 不懂就保持默认；改成空列表 [] 则连 fake-ip 也不放行（可能影响部分代理下的 fetch）。
# ---------------------------------------------------------------------------
ssrf_allow_ranges = ["198.18.0.0/15"]

[ui]
# ---------------------------------------------------------------------------
# 面板新手引导进度（由面板自动维护，不需要手改）：
# ""=从未决定（首启会弹一次引导），welcome=显示引导，trial=先体验，done=已完成
# ---------------------------------------------------------------------------
onboarding_stage = ""
# 首启引导提示是否已发过（只发一次，不骚扰；删掉本行恢复默认也一样）
first_run_notice_sent = false

[host]
# ---------------------------------------------------------------------------
# true = 用户已在面板选择“由本插件接管搜索”：每次启动重申停用宿主内置
# 『网络搜索』（失败只记日志，绝不影响启动）。在面板里切换即可，不必手改。
# ---------------------------------------------------------------------------
takeover_search = false
