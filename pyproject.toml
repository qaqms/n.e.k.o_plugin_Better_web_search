[project]
name = "free_web_search"
version = "0.2.0"
# Intentionally empty: this plugin is stdlib-only so the distributed package
# needs no vendor/ tree. See README.
dependencies = []

[tool.neko.build]
# The release check imports this plugin to probe its entry metadata, which
# leaves __pycache__ behind in the source tree; keep generated bytecode and
# local caches out of the distributed package.
exclude_dirs = ["__pycache__", ".pytest_cache", ".ruff_cache"]
exclude_files = ["*.pyc", "*.pyo"]
